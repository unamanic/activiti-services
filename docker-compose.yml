version: "3.9"

services:

  # ── Infrastructure ────────────────────────────────────────────────

  activiti-postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: activiti
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: activitidb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: activiti
      RABBITMQ_DEFAULT_PASS: activiti
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  keycloak:
    container_name: keycloak
    image: activiti/activiti-keycloak
    volumes:
      - ./activiti-realm.json:/opt/jboss/keycloak/activiti-realm.json
    ports:
      - "8088:8080"
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Application Services ──────────────────────────────────────────

  runtime-bundle:
    build:
      context: .
      dockerfile: runtime-bundle/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://activiti-postgres:5432/activitidb
      SPRING_DATASOURCE_USERNAME: activiti
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_DATASOURCE_HIKARI_SCHEMA: runtime_bundle
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: activiti
      SPRING_RABBITMQ_PASSWORD: activiti
      ACT_KEYCLOAK_URL: http://keycloak:8080/auth
      ACT_KEYCLOAK_REALM: activiti
      ACT_KEYCLOAK_RESOURCE: activiti
    ports:
      - "8081:8080"
    depends_on:
      - activiti-postgres
      - rabbitmq
      - keycloak
    restart: unless-stopped

  connector-service:
    build:
      context: .
      dockerfile: connector-service/Dockerfile
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: activiti
      SPRING_RABBITMQ_PASSWORD: activiti
    ports:
      - "8083:8080"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://activiti-postgres:5432/activitidb
      SPRING_DATASOURCE_USERNAME: activiti
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_DATASOURCE_HIKARI_SCHEMA: query_service
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: activiti
      SPRING_RABBITMQ_PASSWORD: activiti
      ACT_KEYCLOAK_URL: http://keycloak:8080/auth
      ACT_KEYCLOAK_REALM: activiti
      ACT_KEYCLOAK_RESOURCE: activiti
    ports:
      - "8182:8080"
    depends_on:
      - activiti-postgres
      - rabbitmq
      - keycloak
    restart: unless-stopped

  modeler-backend:
    build:
      context: .
      dockerfile: modeler-backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://activiti-postgres:5432/activitidb
      SPRING_DATASOURCE_USERNAME: activiti
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_DATASOURCE_HIKARI_SCHEMA: modeler
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: activiti
      SPRING_RABBITMQ_PASSWORD: activiti
      ACT_KEYCLOAK_URL: http://keycloak:8080/auth
      ACT_KEYCLOAK_REALM: activiti
      ACT_KEYCLOAK_RESOURCE: activiti
    ports:
      - "8084:8080"
    depends_on:
      - activiti-postgres
      - rabbitmq
      - keycloak
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:

