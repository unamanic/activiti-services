worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS so upstream resolution happens at request time,
    # not at startup — allows nginx to start before app containers are ready.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;

        location /auth/ {
            set $keycloak keycloak;
            proxy_pass http://$keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /runtime-bundle/ {
            set $rb runtime-bundle;
            proxy_pass http://$rb:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /query/ {
            set $qs query-service;
            proxy_pass http://$qs:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /modeling-service/ {
            set $mb modeler-backend;
            proxy_pass http://$mb:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
